name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npx -y publint@0.3 --strict
      # A stylesheet has no type declarations; bundlers handle `*.css` imports themselves
      - run: npx -y @arethetypeswrong/cli@0.18 --pack --profile esm-only --exclude-entrypoints style.css
